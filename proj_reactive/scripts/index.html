<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>awooga</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="navbar">
    <a href="#">1</a>
    <a href="#">2</a>
    <a href="#">3</a>
    <a href="#">4</a>
</div>

<div id="slideshow">

    <input type="radio" name="slide" id="slide1" checked>
    <input type="radio" name="slide" id="slide2">
    <input type="radio" name="slide" id="slide3">
    <input type="radio" name="slide" id="slide4">
    <input type="radio" name="slide" id="slide5">

    <div class="slide-wrapper">

        <div class="slide">
            <img src="../assets/game1.jpg" alt="Game 1">
        </div>

        <div class="slide">
            <img src="../assets/game2.jpg" alt="Game 2">
        </div>

        <div class="slide">
            <img src="../assets/game3.jpg" alt="Game 3">
        </div>

        <div class="slide">
            <img src="../assets/game4.jpg" alt="Game 4">
        </div>

        <div class="slide">
            <img src="../assets/game5.jpg" alt="Game 5">
        </div>

    </div>

    <div class="slide-buttons">
        <label for="slide1">1</label>
        <label for="slide2">2</label>
        <label for="slide3">3</label>
        <label for="slide4">4</label>
        <label for="slide5">5</label>
    </div>

</div>

</body>
</html>
