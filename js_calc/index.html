<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini SR-270N</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
          rel="stylesheet">
</head>
<body>
<div id = "calculator-wrapper">
    <div id="calculator">
        <!--actual screen-->
        <div id="screen-wrapper1">
            <div id="screen-wrapper2">
                <div id="screen">
                    <div id="expression">
                        <span id="expression-text"></span>
                        <span id="typed-cursor"></span>
                    </div>

                    <div id="result">0</div>
                </div>
            </div>
        </div>
            <div id="top-keys">
                <button class = "top-btn" onclick="appendToDisplay('^')">xʸ</button>
                <button class = "top-btn" onclick="appendToDisplay('^2')">x²</button>
                <button class = "top-btn" onclick="appendToDisplay('(')">(</button>
                <button class = "top-btn" onclick="appendToDisplay(')')">)</button>

                <button class = "top-btn" onclick="appendToDisplay('!')">n!</button>
                <button class="top-btn" onclick="appendToDisplay('%')">%</button>
                <button class = "top-btn" id="off-btn" onclick="disableDisplay()">OFF</button>
                <button class = "top-btn" id="on-btn" onclick="clearDisplay()">ON/AC</button>

            </div>

            <div id="bottom-keys">
                <button class="bottom-btn" onclick="appendToDisplay('7')">7</button>
                <button class="bottom-btn" onclick="appendToDisplay('8')">8</button>
                <button class="bottom-btn" onclick="appendToDisplay('9')">9</button>
                <button class="bottom-btn" onclick="appendFunction('√')">√</button>
                <button class="bottom-btn" onclick="deleteLast()">DEL</button>

                <button class="bottom-btn" onclick="appendToDisplay('4')">4</button>
                <button class="bottom-btn" onclick="appendToDisplay('5')">5</button>
                <button class="bottom-btn" onclick="appendToDisplay('6')">6</button>
                <button class="bottom-btn" onclick="appendToDisplay('*')">×</button>
                <button class="bottom-btn" onclick="appendToDisplay('/')">÷</button>

                <button class="bottom-btn" onclick="appendToDisplay('1')">1</button>
                <button class="bottom-btn" onclick="appendToDisplay('2')">2</button>
                <button class="bottom-btn" onclick="appendToDisplay('3')">3</button>
                <button class="bottom-btn" onclick="appendToDisplay('+')">+</button>
                <button class="bottom-btn" onclick="appendToDisplay('-')">-</button>
            
                <button class="bottom-btn" onclick="appendToDisplay('0')">0</button>
                <button class="bottom-btn" onclick="appendToDisplay('.')">.</button>
                <button class="bottom-btn"></button>
                <button class="bottom-btn" onclick="appendToDisplay('Ans')">ANS</button>
                <button class="bottom-btn" onclick="calculate()">=</button>
            </div>
    </div>
</div>

<script src="index.js"></script>

</body>
</html>
